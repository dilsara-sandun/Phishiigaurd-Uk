version: '3.8'

services:
  # ── Database Service ────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: phishguard-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phishguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ── Cache Service ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: phishguard-redis
    restart: always
    ports:
      - "6379:6379"

  # ── API Backend Service ──────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: phishguard-backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/phishguard
      - SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/phishguard
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=phishguard-production-secure-secret-key-change-me
      - PEPPER=phishguard-production-secure-pepper-key-change-me
      - ALLOWED_ORIGINS=http://localhost,https://localhost,http://localhost:5173
    depends_on:
      - postgres
      - redis

  # ── Web Frontend Service ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: phishguard-frontend
    restart: always
    depends_on:
      - backend

  # ── Reverse Proxy Gateway ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: phishguard-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
