events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Basic Settings & Slowloris mitigation
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 15s; # Short timeout to drop stale connections
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    
    # Hide nginx version
    server_tokens off;

    # DDoS Rate Limiting
    # Zone 'api_limit' allows 20 reqs/sec per IP address (10mb state stores ~160k IPs)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    # Limit connections per IP
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard Security Headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /api/ {
            # Apply rate limiting to API routes
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn addr_limit 10;

            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket support for React Fast Refresh / Realtime Updates
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
