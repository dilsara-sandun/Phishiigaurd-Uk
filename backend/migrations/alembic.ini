# alembic.ini
# ──────────────────────────────────────────────────────────────────────────────
# Alembic configuration for PhishGuard UK.
# The sqlalchemy.url value here is overridden at runtime by migrations/env.py
# using the SYNC_DATABASE_URL from app/config.py — so it is safe to leave the
# placeholder below.

[alembic]
script_location = migrations
prepend_sys_path = .

# Template used when generating new revision files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Overridden by env.py at runtime
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/phishguard

# Timezone for generated revision timestamps
timezone = UTC

# Truncate slug to this length in filename
truncate_slug_length = 40

# Allow autogenerate to detect column type changes
compare_type = true

# ── Logging ───────────────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S