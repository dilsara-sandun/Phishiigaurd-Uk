<!DOCTYPE html>
<html>
<head>
  <title>PhishGuard UK Live Analyzer</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 320px;
      padding: 15px;
      margin: 0;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .header img {
      width: 24px;
      height: 24px;
      margin-right: 10px;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      color: #1e3a8a;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    #result {
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }
    .status {
      font-weight: bold;
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 4px;
    }
    .status.phishing { background-color: #fee2e2; color: #b91c1c; }
    .status.legitimate { background-color: #dcfce3; color: #166534; }
    .status.suspicious { background-color: #fef9c3; color: #854d0e; }
    
    .section {
      margin-bottom: 10px;
    }
    .section h3 {
      margin: 0 0 5px 0;
      font-size: 13px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .details {
      background: white;
      border: 1px solid #e2e8f0;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    #explanation {
      font-style: italic;
      color: #334155;
    }
    .loader {
      display: none;
      text-align: center;
      margin-top: 15px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>PhishGuard UK Live Analyzer</h2>
  </div>
  
  <p style="font-size: 13px; color: #64748b; margin-top: 0;">Click below to analyze the current page's tech stack and indicators.</p>
  
  <button id="analyzeBtn">Analyze Current Page</button>
  
  <div class="loader" id="loader">Analyzing... Please wait.</div>
  
  <div id="result">
    <div id="statusBadge" class="status"></div>
    
    <div class="section">
      <h3>AI Verdict</h3>
      <div class="details" id="explanation"></div>
    </div>
    
    <div class="section">
      <h3>Quick Details</h3>
      <div class="details">
        <div id="techStack"></div>
        <div id="riskFactors" style="margin-top: 5px; color: #b91c1c;"></div>
      </div>
    </div>
    
    <div style="text-align: center; margin-top: 15px;">
      <a href="http://localhost:5173/app/platform" target="_blank" style="color: #2563eb; font-size: 12px; text-decoration: none;">View full report in Dashboard</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
